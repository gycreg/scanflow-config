[regfox]
api_key = ''
base_url = 'https://api.webconnex.com/v2/public'

[sync]
interval = '1h'
webhook_port = 8080
csv_path = '../scanflow_data/registrants.csv'
backup_dir = '../scanflow_data/backups'
max_backups = 10

[rate_limits]
daily_limit = 10000
burst_limit = 900
burst_window = '15m'
persist_file = './rate_limit_state.json'

[[events]]
name = 'Gyc26'
form_id = '1015512'
processor = 'gyc25'

[[events.fields]]
column = 'DisplayId'
sources = ['@displayId']

[[events.fields]]
column = 'NameFirst'
sources = ['name.first']

[[events.fields]]
column = 'NameLast'
sources = ['name.last']

[[events.fields]]
column = 'GroupId'
sources = ['@orderId']

[[events.fields]]
column = 'EventPass'
sources = ['registrationOptions', 'registrationMinors']
default = 'ERROR - NO PASS'

[[events.fields]]
column = 'ShirtSize'
sources = ['pleaseSelectTshirtSize']

[events.fields.values]
mens2xLarge = "Men's 2XL"
mens3xLarge = "Men's 3XL"
mensExtraLarge = "Men's Large"
mensExtraLarge2 = "Men's XL"
mensLarge = "Men's Medium"
mensMedium = "Men's Small"
mensSmall = "Women's 2XL"
womensExtraLarge = "Women's XL"
womensLarge = "Women's Large"
womensMedium = "Women's Medium"
womensSmall = "Women's Small"

[[events.fields]]
column = 'phone'
sources = ['phone']

[[events.fields]]
column = 'email'
sources = ['email']

[[events.fields]]
column = 'address_country'
sources = ['address.country']

[[events.fields]]
column = 'address_city'
sources = ['address.city']

[[events.fields]]
column = 'address_state'
sources = ['address.state']

[[events.fields]]
column = 'date_of_birth'
sources = ['dateOfBirth']

[[events.fields]]
column = 'FirstTime'
sources = ['thisYourFirstTime2', 'thisYourFirstTime']

[[events.fields]]
column = 'RegistrationReason'
sources = ['howDidYouHear']

[[events.fields]]
column = 'Subtext'
sources = ['address.country', 'address.city', 'address.state']
transform = 'location'

[[events.fields]]
column = 'OutreachProject'
sources = ['projectTypes']

[events.fields.values]
bibleStudy = 'Bible Study'
literatureEvangelism = 'Literature Evangelism'
mediaEvangelism = 'Media Evangelism'
packingProject = 'Packing Project'
unhousedOutreach = 'Compassion Project (SALT)'

[[events.fields]]
column = 'Meals.thursday_breakfast'
sources = ['mealOptions.thursdayBreakfast', 'multipleChoice2', 'mealPackage', 'fullMealPackage']
transform = 'boolean'

[events.fields.values]
allMealsPackage = 'true'

