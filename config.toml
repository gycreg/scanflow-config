[regfox]
api_key = ''
base_url = 'https://api.webconnex.com/v2/public'

[sync]
interval = '1h'
webhook_port = 8080
csv_path = '../scanflow_data/registrants.csv'
backup_dir = '../scanflow_data/backups'
max_backups = 10

[rate_limits]
daily_limit = 10000
burst_limit = 900
burst_window = '15m'
persist_file = './rate_limit_state.json'

[[events]]
name = 'gyc25'
form_id = '809153'
processor = 'gyc25'
